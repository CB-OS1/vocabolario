<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Vocabolario — Italienisch lernen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --inchiostro: #17324f;     /* dunkles Marineblau, "Tinte" */
    --carta: #f3f7fb;          /* Papierton, kühles Blauweiß */
    --mare: #2f6690;           /* Seeblau, starker Akzent (ehem. Terrakotta) */
    --cielo: #7fb2d6;          /* Himmelblau, ruhiger Kontrast (ehem. Salbeigrün) */
    --azzurro: #3f8fd1;        /* Azurblau, klarer Akzent (ehem. Senfgold) */
    --linea: rgba(23,50,79,0.14);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: var(--carta);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,45,61,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--inchiostro);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }

  .app{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding: 20px 18px 28px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 6px;
  }
  .titel{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 28px;
    letter-spacing: -0.01em;
  }
  .titel em{ color: var(--azzurro); font-style: normal; }
  .untertitel{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color: var(--inchiostro);
    opacity:0.55;
  }

  .stats{
    display:flex;
    gap:10px;
    margin: 14px 0 18px;
    font-size:12px;
  }
  .pill{
    border:1px solid var(--linea);
    border-radius:999px;
    padding:6px 12px;
    display:flex;
    align-items:center;
    gap:6px;
    background: rgba(255,255,255,0.4);
  }
  .dot{width:7px; height:7px; border-radius:50%;}
  .dot.cielo{background:var(--cielo);}
  .dot.mare{background:var(--mare);}
  .dot.azzurro{background:var(--azzurro);}

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    perspective: 1400px;
  }

  .deck-label{
    text-align:center;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    opacity:0.5;
    margin-bottom:10px;
  }

  .card{
    position:relative;
    width:100%;
    aspect-ratio: 4/5;
    max-height: 420px;
    cursor:pointer;
  }

  .face{
    position:absolute;
    inset:0;
    border-radius: 18px;
    border: 1.5px solid var(--inchiostro);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 32px 24px;
    text-align:center;
    box-shadow: 6px 6px 0 var(--inchiostro);
    transition: transform 0.35s cubic-bezier(.4,.2,.2,1), opacity 0.25s ease;
  }
  .face.front{ background: #f8fbfe; }
  .face.back, .face.konjugation, .face.notiz{
    background: var(--inchiostro);
    color: var(--carta);
  }
  .face.eintretend{
    transform: scale(0.96);
    opacity: 0;
  }

  .konj-tabelle{
    width:100%;
    max-width:260px;
    font-size:13px;
    text-align:left;
    border-collapse: collapse;
    margin-top:6px;
  }
  .konj-tabelle tr{ border-bottom: 1px solid rgba(246,241,228,0.18); }
  .konj-tabelle tr:last-child{ border-bottom:none; }
  .konj-tabelle td{ padding: 5px 4px; }
  .konj-tabelle td.pron{ opacity:0.55; width:34%; }
  .konj-tabelle td.form{ font-weight:600; color: var(--azzurro); }

  .kategorie{
    position:absolute;
    top:14px;
    left:16px;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.5;
  }

  .notiz-badge{
    position:absolute;
    top:14px;
    right:16px;
    width:20px;
    height:20px;
    border-radius:50%;
    background: var(--azzurro);
    color: var(--inchiostro);
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .wort{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 36px;
    line-height:1.1;
    margin-bottom:10px;
  }
  .face.back .wort{ color: var(--azzurro); }

  .artikel{
    font-size:13px;
    opacity:0.55;
    margin-bottom: 18px;
  }

  .hinweis{
    font-size:12px;
    opacity:0.45;
    position:absolute;
    bottom:16px;
  }

  .beispiel{
    font-size:13px;
    line-height:1.5;
    opacity:0.85;
    font-style:italic;
    max-width: 90%;
  }

  .notiz-text{
    font-size:16px;
    line-height:1.6;
    color: var(--azzurro);
    max-width: 90%;
    white-space: pre-wrap;
  }

  /* Zweigeteilte Notiz-Seite: notiz1 immer oben, notiz2 immer unten.
     flex-direction:column + justify-content:center sorgt dafür, dass bei nur
     einem gefüllten Feld der Text zentriert bleibt statt an einer Kante zu kleben. */
  .notiz-doppelt{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    width:100%;
  }
  .notiz-abschnitt{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .notiz-trenner{
    width:50%;
    height:1px;
    background: var(--linea);
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius: 12px;
    border: 1.5px solid var(--inchiostro);
    padding: 14px 0;
    flex:1;
    cursor:pointer;
    background:#f8fbfe;
    color:var(--inchiostro);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 3px 3px 0 var(--inchiostro);
  }
  button:active{ transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--inchiostro); }

  .btn-zurueck{ background: #eaf5fb; }
  .btn-weiter{ background: var(--azzurro); color:#f8fbfe; }
  button:disabled{ opacity:0.35; cursor:default; }
  button:disabled:active{ transform:none; box-shadow: 3px 3px 0 var(--inchiostro); }

  .reset-row{
    text-align:center;
    margin-top: 18px;
    font-size:12px;
  }
  .reset-row a{
    color: var(--inchiostro);
    opacity:0.5;
    text-decoration: underline;
    cursor:pointer;
  }

  .fertig{
    text-align:center;
    padding: 40px 10px;
  }
  .fertig .wort{ font-size:24px; }
  .fertig p{ opacity:0.6; font-size:14px; margin: 10px 0 22px; }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }

  /* Niveau-Auswahl */
  .niveau-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap: 8px;
  }
  .niveau-frage{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 22px;
    margin-bottom: 4px;
  }
  .niveau-unter{
    font-size:13px;
    opacity:0.55;
    margin-bottom: 28px;
    max-width: 280px;
  }
  .niveau-optionen{
    display:flex;
    flex-direction:column;
    gap: 14px;
    width: 100%;
    max-width: 320px;
  }
  .niveau-btn{
    text-align:left;
    border: 1.5px solid var(--inchiostro);
    border-radius: 14px;
    padding: 18px 20px;
    background: #f8fbfe;
    cursor:pointer;
    box-shadow: 4px 4px 0 var(--inchiostro);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .niveau-btn:active{ transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--inchiostro); }
  .niveau-btn .label{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 20px;
    display:block;
  }
  .niveau-btn .desc{
    font-size:12px;
    opacity:0.55;
    margin-top: 4px;
    display:block;
  }
  .niveau-btn.a1 .label{ color: var(--cielo); }
  .niveau-btn.a2 .label{ color: var(--mare); }
  .niveau-wechsel{
    text-align:center;
    margin-top: 12px;
    font-size:12px;
  }
  .niveau-wechsel a{
    color: var(--inchiostro);
    opacity:0.5;
    text-decoration: underline;
    cursor:pointer;
  }

  /* Upload-Bereich */
  .upload-zone{
    border: 2px dashed var(--inchiostro);
    border-radius: 14px;
    padding: 28px 20px;
    text-align:center;
    cursor:pointer;
    background: rgba(255,255,255,0.3);
    transition: background 0.15s;
    position:relative;
    margin-top: 8px;
  }
  .upload-zone:hover, .upload-zone.drag{ background: rgba(255,255,255,0.65); }
  .upload-zone input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
  }
  .upload-icon{ font-size:32px; margin-bottom:6px; }
  .upload-text{ font-size:13px; opacity:0.6; line-height:1.5; }
  .upload-text strong{ color: var(--mare); }
  .upload-fehler{
    background: #e8f1f7;
    border: 1.5px solid var(--mare);
    border-radius: 10px;
    padding: 10px 14px;
    font-size:12px;
    color: var(--mare);
    margin-top: 10px;
    display:none;
  }
  .upload-info{
    font-size:11px;
    opacity:0.45;
    margin-top:10px;
    text-align:center;
    line-height:1.5;
  }
  .niveau-btn.eigene .label{ color: var(--azzurro); }

  /* "Vokabeln laden"-Link, immer zentriert unten, unabhängig vom Zustand */
  .datei-laden-row{
    text-align:center;
    margin-top: 14px;
    font-size:13px;
  }
  .datei-laden-row a{
    color: var(--inchiostro);
    opacity:0.55;
    text-decoration: underline;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="titel">Vocabolar<em>Io</em></div>
      <div class="untertitel" id="untertitelText">Italienisch</div>
    </div>
  </header>

  <div class="stats" id="statsRow">
    <div class="pill"><span class="dot azzurro"></span><span id="statHeute">0</span> Karten heute</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="reset-row" id="resetRow"><a id="resetLink">Fortschritt zurücksetzen</a> · <a id="deckLink">Deck wechseln</a></div>
  <div class="datei-laden-row"><a id="linkVokabelnLaden">Vokabeln laden</a></div>
</div>

<script>
// ---------- Konjugator (Presente Indicativo) ----------
const PRONOMEN = ["io","tu","lui/lei","noi","voi","loro"];

const IRREGOLARI = {

  dedurre:     ["deduco","deduci","deduce","deduciamo","deducete","deducono"],
  ridurre:     ["riduco","riduci","riduce","riduciamo","riducete","riducono"],

// Verben, die im Presente das Einschub-Infix "-isc-" verwenden (io capISCo, nicht *capo).
// Bei -ire-Verben lässt sich das nicht aus der Endung ableiten (dormire vs. capire sehen
// von der Endung her identisch aus) — deshalb eine explizite Positivliste. Nicht
// erschöpfend, aber deckt die gebräuchlichsten Fälle ab; bei Bedarf einfach ergänzen.

  "capire","finire","preferire","pulire","costruire","agire","guarire","punire",
  "spedire","garantire","stabilire","suggerire","proibire","impedire","gestire",

  "scandire","sparire","starnutire","guarnire","abolire","arrossire","bandire",
  "compatire","concepire","contribuire","demolire","diminuire","disubbidire",
  "esibire","fallire","fiorire","impazzire","impallidire","indebolire","intuire",

function konjugiere(infinitiv, typ){
  // Reflexivität und die passenden Pronomen zuerst bestimmen — sowohl der
  // IRR-Zweig gleich unten als auch der reguläre Zweig weiter unten brauchen sie.
  const reflexiv = infinitiv.includes("si") && infinitiv.endsWith("si");
  const pronRefl = reflexiv ? ["mi ","ti ","si ","ci ","vi ","si "] : ["","","","","",""];

  if(typ.startsWith("v:IRR:")){
    const basisIRR = typ.replace("v:IRR:","");
    const formen = IRREGOLARI[basisIRR];
    if(formen) return formen.map((f,i) => pronRefl[i] + f);
  }

  // "si" abtrennen UND das dabei ursprünglich wegfallende "e" wieder anhängen:
  // svegliarsi -> "svegliar" + "e" = svegliare (das ist der eigentliche Infinitiv,
  // von dem aus der Stamm berechnet werden muss)
  const basis = reflexiv ? infinitiv.slice(0,-2) + "e" : infinitiv;
  const stamm = basis.slice(0,-3);
  let endungen;
  if(typ === "v:are") endungen = ["o","i","a","iamo","ate","ano"];
  else if(typ === "v:ere") endungen = ["o","i","e","iamo","ete","ono"];
  else if(typ === "v:ire") endungen = ["o","i","e","iamo","ite","ono"];
  else if(typ === "v:isc") endungen = ["isco","isci","isce","iamo","ite","iscono"];
  else endungen = ["o","i","e","iamo","ete","ono"];
  // Italienische Rechtschreibregel Nr. 1: endet der Stamm auf "i" (z.B. "mangi-" von
  // mangiare) und beginnt die Endung ebenfalls mit "i" (-i, -iamo), verschmilzt
  // das doppelte i zu einem einzigen -> mangi + iamo = mangiamo, nicht mangiiamo.
  //
  // Italienische Rechtschreibregel Nr. 2 (das Gegenstück): endet der Stamm auf "c"
  // oder "g" (z.B. "gioc-" von giocare, "pag-" von pagare) und beginnt die Endung
  // mit "i", muss ein "h" eingeschoben werden -> gioc + h + iamo = giochiamo, nicht
  // giociamo. Grund: "ci"/"gi" wird im Italienischen weich ausgesprochen (wie in
  // "cena", "gente"), aber das "c"/"g" am Stammende von -care/-gare-Verben ist hart
  // (wie in "casa", "gatto") und muss das auch in der konjugierten Form bleiben.
  // Gilt nur für v:are, weil dieses Hart/Weich-Problem nur bei -care/-gare-Infinitiven
  // auftritt -- bei -ere/-ire ergibt sich die Aussprache schon aus dem Infinitiv selbst.
  return endungen.map((e,i) => {
    let form;
    if(typ === 'v:are' && (stamm.endsWith('c') || stamm.endsWith('g')) && e.startsWith('i')){
      form = stamm + 'h' + e;
    } else if(stamm.endsWith('i') && e.startsWith('i')){
      form = stamm + e.slice(1);
    } else {
      form = stamm + e;
    }
    return pronRefl[i] + form;
  });
}

function istVerb(v){ return v.typ && v.typ.startsWith("v:"); }

// Gibt es für diese Karte überhaupt eine Notiz-Seite? Ja, sobald mindestens
// eines der beiden Felder gefüllt ist. Eine Funktion für diese Prüfung, statt
// "v.notiz1 || v.notiz2" viermal im Code zu wiederholen (siehe maxZustandFuer,
// notizBadge, die beiden "Antippen für..."-Hinweise).
function hatNotiz(v){
  return !!(v.notiz1 || v.notiz2);
}

// Höchster erreichbarer zustand-Wert für eine Karte. Reihenfolge ist immer
// front(0) -> back(1) -> [konjugation, nur bei Verben] -> [notiz, nur wenn vorhanden].
// Die Notiz-Position hängt davon ab, ob vorher noch die Konjugationsseite kommt.
function maxZustandFuer(v){
  const nachKonjugation = istVerb(v) ? 2 : 1;
  return hatNotiz(v) ? nachKonjugation + 1 : nachKonjugation;
}

// ---------- Automatische Worttyp-Erkennung ----------
// Ersetzt die frühere "typ"-Spalte in der xlsx: der Typ wird direkt aus dem
// italienischen Wort abgeleitet, keine manuelle Angabe mehr nötig.

function hatArtikel(it){
  // Nomen werden in diesem Projekt per Konvention mit Artikel gespeichert (z.B. "la casa"),
  // Verben und Adjektive nie. Das macht diese Prüfung überraschend zuverlässig.
  // Sonderfall "l'": anders als "il/la/lo/..." steht davor NIE ein Leerzeichen
  // (l'amico, l'acqua) — deshalb eigene, von den anderen Artikeln getrennte Prüfung.
  const wort = it.trim();
  return /^(il|lo|la|i|le|gli)\s/i.test(wort) || /^l['’]/i.test(wort);
}

function basisInfinitiv(wort){
  // Reflexive Verben (z.B. "svegliarsi") auf die Grundform zurückführen ("svegliare"),
  // damit die Endungs- und IRREGOLARI-Prüfung greift. konjugiere() kümmert sich später
  // ohnehin selbst um die mi/ti/si/ci/vi-Pronomen anhand des Original-Infinitivs.
  if(/(arsi|ersi|irsi)$/.test(wort)) return wort.slice(0, -2) + 'e';
  return wort;
}

function erkenneTyp(it){
  const wort = it.trim().toLowerCase();
  if(hatArtikel(wort)) return 'n';

  const basis = basisInfinitiv(wort);
  if(IRREGOLARI[basis]) return 'v:IRR:' + basis;
  if(basis.endsWith('are')) return 'v:are';
  if(basis.endsWith('ere')) return 'v:ere';
  if(basis.endsWith('ire')) return ISC_VERBEN.has(basis) ? 'v:isc' : 'v:ire';

  return 'x'; // weder Artikel noch Verb-Endung -> generisches Beispiel (Adjektive, Sonstiges)
}

function mische(array){
  const a = array.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- Beispielsätze (nur für Verben, aus den 500 kuratierten Verben) ----------
// Bei Nomen, Adjektiven & Sonstigem kommt ein Beispielsatz ausschließlich über die
// notizen-Spalte (eigene Kartenseite) -- kein automatisch generiertes Template mehr.
// sprache: 'it' oder 'de' -- muss zur Sprache des Worts passen, das gerade neben
// dem Satz angezeigt wird (also zur "antwort" auf der back-Seite). Vorher wurde
// hier hart satz_it zurückgegeben, unabhängig von der Lernrichtung -- dadurch
// stand bei IT->DE-Richtung ein italienischer Satz unter dem deutschen Wort.
function gibBeispiel(v, sprache){
  if(!istVerb(v)) return '';
  // Gleiche Normalisierung wie in erkenneTyp(): BEISPIELSAETZE ist komplett
  // kleingeschrieben angelegt. Ohne trim()/toLowerCase() hier würde z.B. "Dormire"
  // (Großschreibung in der xlsx) den Eintrag "dormire" nicht finden -- der Lookup
  // scheitert dann still (vorbereitet === undefined), ohne Fehler oder Hinweis.
  const key = v.it.trim().toLowerCase();
  const vorbereitet = BEISPIELSAETZE[key];
  if(vorbereitet) return sprache === 'de' ? vorbereitet.satz_de : vorbereitet.satz_it;
  // Fallback nur für den Fall, dass ein Verb NICHT in den 500 kuratierten steht
  // (z.B. ein Verb, das du selbst per xlsx hinzugefügt hast). Die konjugierten
  // Formen sind immer italienisch -- für "de" gibt es keinen sinnvollen generischen
  // Fallback-Satz, daher dort lieber gar keinen Satz zeigen als einen falschen.
  if(sprache === 'de') return '';
  const formen = konjugiere(v.it, v.typ);
  return `Io ${formen[0]} spesso. / Noi ${formen[3]} insieme.`;
}

// ---------- App-Zustand ----------
let AKTIVE_DATEI = null;  // { blattname: [ {it,de,kat,typ}, ... ], ... } — alle Decks der zuletzt geladenen xlsx
let DECK_NAME = null;     // Name des aktuell gewählten Arbeitsblatts/Decks
let RICHTUNG = 'it-de';   // 'it-de' = Italienisch zeigen, Deutsch erraten | 'de-it' = umgekehrt
let SORTIERT = true;      // true = Reihenfolge wie in der xlsx | false = gemischt

// Baut VOKABELN aus dem aktuellen Deck neu auf, abhängig von SORTIERT.
// .slice() bei sortiert wichtig: liefert eine Kopie, damit VOKABELN nie auf
// dasselbe Array-Objekt wie AKTIVE_DATEI[DECK_NAME] zeigt -- sonst würde
// spätere Bearbeitung von VOKABELN (aktuell passiert das nirgends, aber sicher
// ist sicher) versehentlich auch die Originaldaten verändern.
function vokabelnNeuLaden(){
  return SORTIERT ? AKTIVE_DATEI[DECK_NAME].slice() : mische(AKTIVE_DATEI[DECK_NAME]);
}
let VOKABELN = [];
let idx = 0;
let zustand = 0; // 0 = Frage, 1 = Antwort, 2 = Konjugation (nur bei Verben, immer italienisch)
let punkte = { heute:0 };

const stage = document.getElementById('stage');
const statsRow = document.getElementById('statsRow');
const resetRow = document.getElementById('resetRow');
const untertitelText = document.getElementById('untertitelText');

// ---------- Persistenz: Datei (alle Decks) ----------
async function ladeDatei(){
  try{
    const res = await window.storage.get('vocab-datei');
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return null;
}

async function speichereDatei(decks){
  try{ await window.storage.set('vocab-datei', JSON.stringify(decks)); }catch(e){}
}

// Alte Fortschritts-Einträge löschen, wenn eine neue Datei hochgeladen wird —
// sonst würde z.B. der Kartenindex eines alten Decks auf ein Deck mit anderem
// Inhalt, aber gleichem Blattnamen, angewendet.
async function loescheAltenFortschritt(){
  try{
    const liste = await window.storage.list('vocab-progress-');
    if(liste && liste.keys){
      for(const k of liste.keys){ await window.storage.delete(k); }
    }
  }catch(e){}
}

// ---------- Persistenz: Fortschritt pro Deck ----------
async function ladeFortschritt(deckName){
  try{
    const res = await window.storage.get('vocab-progress-' + deckName);
    if(res && res.value){
      const daten = JSON.parse(res.value);
      // daten.punkte kann bei älteren, vor diesem Update gespeicherten Ständen noch
      // leicht/schwierig enthalten -- die werden hier einfach ignoriert, da wir nur
      // noch heute auslesen. { heute:0, ...daten.punkte } würde sie sogar zurückholen,
      // deshalb explizit nur heute übernehmen.
      punkte = { heute: (daten.punkte && daten.punkte.heute) || 0 };
      idx = (daten.idx || 0) % VOKABELN.length;
      aktualisiereStats();
      return;
    }
  }catch(e){}
  punkte = { heute:0 };
  idx = 0;
  aktualisiereStats();
}

async function speichereFortschritt(){
  try{
    await window.storage.set('vocab-progress-' + DECK_NAME, JSON.stringify({ punkte, idx }));
  }catch(e){}
}

function aktualisiereStats(){
  document.getElementById('statHeute').textContent = punkte.heute;
}

// ---------- Bildschirme ----------
function zeigeLeerenZustand(){
  statsRow.style.display = 'none';

    <div class="niveau-screen">

    </div>
  `;
}

function zeigeUploadScreen(){
  stage.innerHTML = `
    <div class="niveau-screen">
      <div class="niveau-frage">Vokabel-Datei hochladen</div>
      <div class="niveau-unter">XLSX mit deinen Vokabeln — jedes Arbeitsblatt wird zu einem eigenen Deck. Spalten: <strong>it, de</strong> (kat, notiz1, notiz2 optional).</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".xlsx,.xls">
        <div class="upload-icon">📂</div>
        <div class="upload-text">Datei antippen &amp; auswählen<br><strong>.xlsx</strong></div>
      </div>
      <div class="upload-fehler" id="uploadFehler"></div>
      <div class="upload-info">
        Benötigte Spalten: <strong>it</strong> (Italienisch) · <strong>de</strong> (Deutsch)<br>
        Optional: <strong>kat</strong> (Kategorie) · <strong>notiz1</strong>, <strong>notiz2</strong> (eigene Anmerkungen, eigene Kartenseite -- notiz1 oben, notiz2 unten). Verben werden automatisch am italienischen Wort erkannt.
      </div>
      <div style="margin-top:16px;">
        <button id="btnZurueck" style="box-shadow:3px 3px 0 var(--inchiostro); font-size:13px; padding:10px 0;">← Abbrechen</button>
      </div>
    </div>
  `;
  document.getElementById('btnZurueck').onclick = () => {
    if(AKTIVE_DATEI) zeigeDeckAuswahl(); else zeigeLeerenZustand();
  };

  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    if(e.dataTransfer.files[0]) verarbeiteDatei(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => {

  });

function zeigeUploadFehler(msg){
  const el = document.getElementById('uploadFehler');
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}

// ---------- Datei einlesen ----------
async function verarbeiteDatei(file){
  const fehlerEl = document.getElementById('uploadFehler');
  if(fehlerEl) fehlerEl.style.display = 'none';

  const name = file.name.toLowerCase();
  if(!name.endsWith('.xlsx') && !name.endsWith('.xls')){
    zeigeUploadFehler('Bitte nur .xlsx Dateien hochladen.');
    return;
  }

  let decks;
  try{
    decks = await leseXLSXDatei(file);
  } catch(e){
    zeigeUploadFehler('Fehler beim Lesen der Datei: ' + e.message);
    return;
  }

  const namen = Object.keys(decks);
  if(namen.length === 0){
    zeigeUploadFehler('Keine gültigen Arbeitsblätter gefunden. Jedes Blatt braucht Spalten "it" und "de".');
    return;
  }

  await loescheAltenFortschritt();
  await speichereDatei(decks);
  AKTIVE_DATEI = decks;
  zeigeDeckAuswahl();
}

// Sucht in den ersten Zeilen eines Blatts die Header-Zeile (Zellen "it" und "de")
// und liest ab dort die Datensätze ein. So funktioniert es auch, wenn vor dem
// Header noch Titel-/Erklärzeilen stehen (wie in der Vorlage). "typ" wird nicht
// mehr aus der Datei gelesen — erkenneTyp() bestimmt ihn automatisch aus "it".
function parseSheet(zeilen){
  let headerIdx = -1, itIdx = -1, deIdx = -1, katIdx = -1, notiz1Idx = -1, notiz2Idx = -1;
  for(let i = 0; i < Math.min(zeilen.length, 15); i++){
    const zeile = zeilen[i].map(z => (z||'').toString().trim().toLowerCase());
    const itPos = zeile.indexOf('it');
    const dePos = zeile.indexOf('de');
    if(itPos !== -1 && dePos !== -1){
      headerIdx = i; itIdx = itPos; deIdx = dePos;
      katIdx = zeile.indexOf('kat');
      // "notiz1" ist der aktuelle Spaltenname. Ältere xlsx-Dateien (z.B. die
      // ursprüngliche Vorlage) nutzen noch "notizen" -- wird dann als notiz1
      // gelesen, damit bestehende Dateien beim Import nichts verlieren.
      notiz1Idx = zeile.indexOf('notiz1');
      if(notiz1Idx === -1) notiz1Idx = zeile.indexOf('notizen');
      notiz2Idx = zeile.indexOf('notiz2');
      break;
    }
  }
  if(headerIdx === -1) return [];

  const result = [];
  for(let i = headerIdx + 1; i < zeilen.length; i++){
    const row = zeilen[i];
    const it = (row[itIdx]||'').toString().trim();
    const de = (row[deIdx]||'').toString().trim();
    if(!it || !de) continue;
    // Lange Texte sind vermutlich Erklär-/Platzhaltertext, kein echtes Vokabelpaar
    if(it.length > 40 || de.length > 40) continue;
    // Eine "kat"-Zelle mit Klammern (z.B. "Kategorie (optional)") verrät eine
    // Beschreibungszeile aus einer Vorlage, keinen echten Kategorienamen.
    // Achtung: dieser Filter gilt NUR für kat, nicht für die Notiz-Spalten -- eigene
    // Notizen dürfen völlig legitim Klammern enthalten.
    const katRoh = katIdx !== -1 ? (row[katIdx]||'').toString() : '';
    if(katRoh.includes('(')) continue;
    result.push({
      it,
      de,
      kat: katIdx !== -1 ? (katRoh.trim() || 'Eigene') : 'Eigene',
      notiz1: notiz1Idx !== -1 ? (row[notiz1Idx]||'').toString().trim() : '',
      notiz2: notiz2Idx !== -1 ? (row[notiz2Idx]||'').toString().trim() : '',
      typ: erkenneTyp(it)
    });
  }
  return result;
}

function leseXLSXDatei(file){
  return new Promise((resolve, reject) => {
    if(window.XLSX){
      _parseWorkbook(file, resolve, reject);
    } else {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      script.onload = () => _parseWorkbook(file, resolve, reject);
      script.onerror = () => reject(new Error('SheetJS-Bibliothek konnte nicht geladen werden.'));
      document.head.appendChild(script);
    }
  });
}

function _parseWorkbook(file, resolve, reject){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const decks = {};
      for(const blattname of wb.SheetNames){
        const ws = wb.Sheets[blattname];
        const zeilen = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        const eintraege = parseSheet(zeilen);
        if(eintraege.length > 0) decks[blattname] = eintraege;
      }
      resolve(decks);
    } catch(err){ reject(err); }
  };
  reader.onerror = () => reject(new Error('Datei konnte nicht gelesen werden.'));
  reader.readAsArrayBuffer(file);
}

async function waehleDeck(name){
  DECK_NAME = name;
  await ladeFortschritt(name);
  zeigeRichtungsAuswahl();
}

function zeigeRichtungsAuswahl(){
  statsRow.style.display = 'none';

    <div class="niveau-screen">
      <div class="niveau-frage">In welche Richtung möchtest du lernen?</div>

      <div class="niveau-optionen">
        <div class="niveau-btn a1" id="btnItDe">
          <span class="label">IT → DE</span>
          <span class="desc">Italienisches Wort sehen, deutsche Übersetzung erraten</span>
        </div>
        <div class="niveau-btn a2" id="btnDeIt">
          <span class="label">DE → IT</span>
          <span class="desc">Deutsches Wort sehen, italienische Übersetzung erraten</span>

function waehleRichtung(richtung){
  RICHTUNG = richtung;

}

function zeigeSortierAuswahl(){
  stage.innerHTML = `
    <div class="niveau-screen">
      <div class="niveau-frage">Sortiert oder gemischt lernen?</div>
      <div class="niveau-unter">Sortiert = Reihenfolge wie in deiner Datei. Gemischt = zufällige Reihenfolge.</div>
      <div class="niveau-optionen">
        <div class="niveau-btn a1" id="btnSortiert">
          <span class="label">Sortiert</span>
          <span class="desc">Genau wie in der xlsx</span>
        </div>
        <div class="niveau-btn a2" id="btnGemischt">
          <span class="label">Gemischt</span>
          <span class="desc">Zufällige Reihenfolge</span>
        </div>
      </div>
    </div>
  `;
  document.getElementById('btnSortiert').onclick = () => waehleSortierung(true);
  document.getElementById('btnGemischt').onclick = () => waehleSortierung(false);

function waehleSortierung(sortiert){
  SORTIERT = sortiert;
  VOKABELN = vokabelnNeuLaden();
  statsRow.style.display = 'flex';
  resetRow.style.display = 'block';
  aktualisiereStats();
  render();
}

function gibFaceHTML(v, zustand){
  // Bei RICHTUNG === 'de-it' wird die Frage-/Antwort-Seite gegenüber
  // dem Standardfall ('it-de') einfach vertauscht.
  const frage = RICHTUNG === 'de-it' ? v.de : v.it;
  const antwort = RICHTUNG === 'de-it' ? v.it : v.de;
  // Kleiner Hinweis oben rechts, dass es zu diesem Wort eine eigene Notiz gibt.
  // Nur auf front/back/konjugation -- auf der Notiz-Seite selbst wäre er redundant.
  const notizBadge = hatNotiz(v) ? '<div class="notiz-badge">N</div>' : '';

  if(zustand === 0){
    // frage ist bei IT->DE Italienisch, bei DE->IT Deutsch (siehe oben) --
    // genau wie beim Beispielsatz auf der Rückseite muss die Sprache des Satzes
    // zur Sprache des gerade gezeigten Worts passen.
    const frageSprache = RICHTUNG === 'de-it' ? 'de' : 'it';
    const beispielSatzFrage = gibBeispiel(v, frageSprache);
    const beispielHTMLFrage = beispielSatzFrage ? `<div class="beispiel">${beispielSatzFrage}</div>` : '';
    return `<div class="face front">
      <div class="kategorie">${v.kat}</div>
      ${notizBadge}
      <div class="wort">${frage}</div>
      ${beispielHTMLFrage}
      <div class="hinweis">Antippen für die Übersetzung</div>
    </div>`;
  }
  if(zustand === 1){
    const naechsterHinweis = istVerb(v)
      ? '<div class="hinweis" style="opacity:0.5">Antippen für die Konjugation</div>'
      : (hatNotiz(v) ? '<div class="hinweis" style="opacity:0.5">Antippen für deine Notiz</div>' : '');
    // gibBeispiel() liefert bei Nomen/Adjektiven/Sonstigem jetzt einen leeren String --
    // die beispiel-Div soll dann komplett wegfallen, nicht als leeres <div></div> im DOM stehen.
    // antwort ist bei IT->DE Deutsch, bei DE->IT Italienisch (siehe oben) --
    // der Beispielsatz muss in derselben Sprache stehen wie das Wort, unter dem er steht.
    const antwortSprache = RICHTUNG === 'de-it' ? 'it' : 'de';
    const beispielSatz = gibBeispiel(v, antwortSprache);
    const beispielHTML = beispielSatz ? `<div class="beispiel">${beispielSatz}</div>` : '';
    return `<div class="face back">
      <div class="kategorie">${v.kat}</div>
      ${notizBadge}
      <div class="wort">${antwort}</div>
      ${beispielHTML}
      ${naechsterHinweis}
    </div>`;
  }
  if(istVerb(v) && zustand === 2){
    // Konjugation ist immer italienisch, unabhängig von der gewählten Lernrichtung
    const formen = konjugiere(v.it, v.typ);
    const zeilen = PRONOMEN.map((p,i) => `<tr><td class="pron">${p}</td><td class="form">${formen[i]}</td></tr>`).join('');
    const hinweis = hatNotiz(v) ? '<div class="hinweis" style="opacity:0.5">Antippen für deine Notiz</div>' : '';
    return `<div class="face konjugation">
      <div class="kategorie">Konjugation · Presente</div>
      ${notizBadge}
      <div class="wort" style="font-size:24px; margin-bottom:4px;">${v.it}</div>
      <table class="konj-tabelle">${zeilen}</table>
      ${hinweis}
    </div>`;
  }
  // Letzter möglicher Zustand: die eigene Notiz (Position variiert, siehe maxZustandFuer).
  // Zweigeteilt: notiz1 immer oben, notiz2 immer unten. Trennlinie nur, wenn
  // wirklich beide Felder gefüllt sind -- bei nur einem gefüllten Feld wäre eine
  // Linie ohne Gegenstück nur verwirrend.
  const beideVorhanden = v.notiz1 && v.notiz2;
  return `<div class="face notiz">
    <div class="kategorie">Notiz</div>
    <div class="notiz-doppelt">
      ${v.notiz1 ? `<div class="notiz-abschnitt"><div class="notiz-text">${v.notiz1}</div></div>` : ''}
      ${beideVorhanden ? '<div class="notiz-trenner"></div>' : ''}
      ${v.notiz2 ? `<div class="notiz-abschnitt"><div class="notiz-text">${v.notiz2}</div></div>` : ''}
    </div>
  </div>`;
}

function render(){
  if(idx >= VOKABELN.length){
    stage.innerHTML = `
      <div class="fertig">
        <div class="wort">Stapel geschafft 🇮🇹</div>
        <p>${punkte.heute} Karten heute gelernt.</p>
        <button id="nochmal" style="box-shadow:3px 3px 0 var(--inchiostro)">Von vorne beginnen</button>
        <div class="reset-row" style="margin-top:14px;"><a id="zurueckZurLetzten">← Zur letzten Karte zurück</a></div>
      </div>`;
    document.getElementById('nochmal').onclick = () => { idx = 0; VOKABELN = vokabelnNeuLaden(); speichereFortschritt(); render(); };
    document.getElementById('zurueckZurLetzten').onclick = () => { idx = VOKABELN.length - 1; render(); };
    return;
  }

  const v = VOKABELN[idx];
  zustand = 0;

  stage.innerHTML = `
    <div class="deck-label">${idx+1} / ${VOKABELN.length} · ${DECK_NAME} · ${RICHTUNG === 'de-it' ? 'DE→IT' : 'IT→DE'}</div>
    <div class="card" id="karte">
      ${gibFaceHTML(v, 0)}
    </div>
    <div class="controls">
      <button class="btn-zurueck" id="btnZurueckKarte" ${idx === 0 ? 'disabled' : ''}>← Zurück</button>
      <button class="btn-weiter" id="btnWeiter">Weiter →</button>
    </div>
  `;

  const karte = document.getElementById('karte');
  karte.onclick = () => {
    const maxZustand = maxZustandFuer(v);
    zustand = (zustand + 1) > maxZustand ? 0 : zustand + 1;
    karte.innerHTML = gibFaceHTML(v, zustand);
    const faceEl = karte.querySelector('.face');
    faceEl.classList.add('eintretend');
    requestAnimationFrame(() => faceEl.classList.remove('eintretend'));
  };

  document.getElementById('btnWeiter').onclick = (e) => { e.stopPropagation(); weiter(); };
  document.getElementById('btnZurueckKarte').onclick = (e) => { e.stopPropagation(); vorherige(); };
}

function weiter(){
  punkte.heute++;
  idx++;
  speichereFortschritt();
  aktualisiereStats();
  render();
}

// Eine Karte zurückspringen. idx wird nie unter 0 gesetzt -- der Zurück-Button
// ist bei der ersten Karte ohnehin deaktiviert (siehe render()), das hier ist
// nur eine zusätzliche Absicherung. punkte.heute wird bewusst NICHT verringert:
// Zurückblättern ist kein "Rückgängigmachen" des Lernens, sondern nur Navigation.
function vorherige(){
  if(idx === 0) return;
  idx--;
  speichereFortschritt();
  render();
}

document.getElementById('resetLink').onclick = async () => {
  idx = 0;
  VOKABELN = vokabelnNeuLaden();
  punkte = { heute:0 };
  await speichereFortschritt();
  aktualisiereStats();
  render();
};

document.getElementById('deckLink').onclick = () => {
  zeigeDeckAuswahl();
};

document.getElementById('linkVokabelnLaden').onclick = () => {
  zeigeUploadScreen();
};

(async function init(){
  statsRow.style.display = 'none';
  resetRow.style.display = 'none';
  const gespeicherteDatei = await ladeDatei();
  if(gespeicherteDatei && Object.keys(gespeicherteDatei).length > 0){
    AKTIVE_DATEI = gespeicherteDatei;
    zeigeDeckAuswahl();
  } else {
    zeigeLeerenZustand();
  }
})();
</script>
